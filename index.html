<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Gerador de Orçamentos · Elite Supply</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --azul: #1058A0;
    --azul-dark: #0d4a8a;
    --azul-light: #E6F1FB;
    --cinza-bg: #F4F7FB;
    --cinza-borda: #D0D9E8;
    --cinza-texto: #555F6E;
    --verde: #1B7A4E;
    --vermelho: #C0392B;
    --amarelo: #E67E22;
    --branco: #ffffff;
    --fonte: 'Segoe UI', system-ui, sans-serif;
  }

  body { font-family: var(--fonte); background: var(--cinza-bg); min-height: 100vh; color: #1a1a2e; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* ── LAYOUT ── */
  .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--azul-dark); color: white;
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .sidebar-logo { padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .sidebar-logo h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
  .sidebar-logo span { color: #7EC8F7; }
  .sidebar-logo p { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 2px; }

  .sidebar-section { padding: 14px 18px 6px; }
  .sidebar-section h2 { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.55); margin-bottom: 8px; }

  .btn-novo {
    width: 100%; padding: 10px 14px; border-radius: 8px;
    background: rgba(255,255,255,0.12); border: 1px dashed rgba(255,255,255,0.3);
    color: white; font-size: 13px; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 8px; transition: background .15s; font-family: var(--fonte);
  }
  .btn-novo:hover { background: rgba(255,255,255,0.18); }
  .btn-novo:disabled { opacity: .5; cursor: wait; }

  .filtros { display: flex; flex-direction: column; gap: 6px; }
  .filtros input, .filtros select {
    width: 100%; padding: 8px 10px; border-radius: 7px; font-size: 12px; font-family: var(--fonte);
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; outline: none;
  }
  .filtros input::placeholder { color: rgba(255,255,255,0.5); }
  .filtros input:focus, .filtros select:focus { border-color: #7EC8F7; }
  .filtros select option { color: #1a1a2e; }
  .lista-contagem { font-size: 10px; color: rgba(255,255,255,0.45); padding: 6px 2px 0; }

  .lista-orcamentos { padding: 6px 10px 20px; display: flex; flex-direction: column; gap: 4px; }

  .orc-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; text-align: left; width: 100%;
    transition: background .15s; position: relative; font-family: var(--fonte);
    border: 1px solid transparent; background: none; color: white;
  }
  .orc-item:hover { background: rgba(255,255,255,0.08); }
  .orc-item:focus-visible { outline: 2px solid #7EC8F7; }
  .orc-item.ativo { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.2); }
  .orc-item-num { font-size: 10px; color: rgba(255,255,255,0.55); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .orc-item-nome { font-size: 13px; color: white; font-weight: 500; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .orc-badge {
    display: inline-block; font-size: 9px; font-weight: 600; padding: 2px 6px;
    border-radius: 20px; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .badge-rascunho { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.75); }
  .badge-baixado  { background: rgba(27,122,78,0.35); color: #7ef5b5; }
  .badge-atualizado { background: rgba(230,126,34,0.35); color: #ffd488; }
  .badge-lixeira { background: rgba(192,57,43,0.35); color: #ffb4ab; }
  .main .badge-rascunho { background: #e8edf4; color: var(--cinza-texto); }
  .main .badge-baixado { background: #dcf3e7; color: var(--verde); }
  .main .badge-atualizado { background: #fdebd9; color: #a85a12; }
  .main .badge-lixeira { background: #fde8e8; color: var(--vermelho); }

  /* ── MAIN ── */
  .main { padding: 28px 32px; overflow-y: auto; min-width: 0; }

  .main-topo { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .main-topo h2 { font-size: 18px; font-weight: 600; color: var(--azul); }
  .main-topo p { font-size: 13px; color: var(--cinza-texto); margin-top: 2px; }

  .save-state { font-size: 12px; color: var(--cinza-texto); white-space: nowrap; }
  .save-state.salvando { color: var(--amarelo); }
  .save-state.salvo { color: var(--verde); }
  .save-state.erro { color: var(--vermelho); font-weight: 600; }

  /* ── BANNERS ── */
  .banner { border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .banner-info { background: var(--azul-light); color: var(--azul-dark); border: 1px solid #b9d5f0; }
  .banner-aviso { background: #fff4e5; color: #8a4a0c; border: 1px solid #f5cf9f; }
  .banner-erro { background: #fde8e8; color: #8e2318; border: 1px solid #f3b7b0; }
  .banner ul { margin: 4px 0 0 18px; }
  .banner .btn { padding: 7px 12px; font-size: 12px; }

  /* ── CARD ── */
  .card { background: white; border-radius: 12px; border: 1px solid var(--cinza-borda); margin-bottom: 16px; overflow: hidden; }
  .card-header {
    padding: 12px 20px; border-bottom: 1px solid var(--cinza-borda);
    background: #f9fbfd; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .card-header h3 { font-size: 13px; font-weight: 600; color: var(--azul); display: flex; align-items: center; gap: 7px; }
  .card-body { padding: 20px; }

  /* ── FORMULÁRIO ── */
  .form-grid { display: grid; gap: 14px; }
  .form-grid-2 { grid-template-columns: 1fr 1fr; }

  .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--cinza-texto); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 9px 11px; font-size: 13px; color: #1a1a2e;
    border: 1px solid var(--cinza-borda); border-radius: 7px;
    background: white; font-family: var(--fonte); transition: border-color .15s; outline: none;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--azul); box-shadow: 0 0 0 3px rgba(16,88,160,0.12); }
  .form-group textarea { resize: vertical; min-height: 60px; }
  input:disabled, select:disabled, textarea:disabled { background: #f3f5f9 !important; color: #4a5260 !important; cursor: not-allowed; }

  .moeda-select { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--cinza-texto); font-weight: 600; }
  .moeda-select select { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--cinza-borda); font-size: 13px; font-family: var(--fonte); }

  /* ── CAMPO CNPJ COM BUSCA ── */
  .cnpj-row { display: flex; gap: 6px; }
  .cnpj-row input { flex: 1; }
  .btn-buscar-cnpj {
    flex-shrink: 0; padding: 9px 14px; font-size: 12px; font-weight: 600;
    border-radius: 7px; border: 1px solid var(--azul); background: var(--azul-light);
    color: var(--azul); cursor: pointer; font-family: var(--fonte);
    display: flex; align-items: center; gap: 5px; white-space: nowrap; transition: background .15s;
  }
  .btn-buscar-cnpj:hover { background: var(--azul); color: white; }
  .btn-buscar-cnpj:disabled { opacity: .6; cursor: not-allowed; }
  .cnpj-status { font-size: 11px; margin-top: 5px; display: none; }
  .cnpj-status.ok { color: var(--verde); display: block; }
  .cnpj-status.erro { color: var(--vermelho); display: block; }
  .cnpj-status.loading { color: var(--cinza-texto); display: block; }

  /* ── TABELA DE ITENS ── */
  .tabela-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: var(--azul); color: white; padding: 10px 12px;
    text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px;
  }
  thead th:last-child { text-align: center; }
  tbody tr:nth-child(even) { background: var(--azul-light); }
  tbody tr:nth-child(odd) { background: white; }
  tbody td { padding: 8px 10px; border-bottom: 1px solid #edf2f8; vertical-align: middle; }
  tbody td input {
    width: 100%; border: 1px solid transparent; background: transparent; font-size: 13px; color: #1a1a2e;
    font-family: var(--fonte); outline: none; padding: 3px 5px; border-radius: 4px;
  }
  tbody td input:focus { background: #fff3cd; border-color: #f0d68a; }
  tbody td input.invalido { border-color: var(--vermelho); background: #fdecea; }
  tbody td input:disabled { background: transparent !important; }
  .col-ref   { width: 90px; }
  .col-qtde  { width: 70px; text-align: center; }
  .col-unit  { width: 120px; text-align: right; }
  .col-total { width: 130px; text-align: right; font-weight: 600; color: var(--azul); white-space: nowrap; }
  .col-dias  { width: 90px; text-align: center; }
  .col-fat   { width: 160px; }
  .col-del   { width: 44px; text-align: center; }

  .btn-del-row {
    background: none; border: none; color: #8a94a3; cursor: pointer; font-size: 16px;
    padding: 2px 6px; border-radius: 4px; transition: color .15s, background .15s;
  }
  .btn-del-row:hover { color: var(--vermelho); background: #fde8e8; }

  .tfoot-total { background: var(--azul) !important; }
  .tfoot-total td { padding: 10px 12px; font-weight: 700; color: white !important; font-size: 13px; }
  .tfoot-total .total-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; text-align: right; }

  .btn-add-linha {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px;
    background: var(--azul-light); border: 1px dashed var(--azul);
    color: var(--azul); border-radius: 7px; font-size: 13px; cursor: pointer;
    margin-top: 10px; transition: background .15s; font-family: var(--fonte);
  }
  .btn-add-linha:hover { background: #d3e8f7; }

  .rodape-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }

  /* ── AÇÕES ── */
  .acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    border: none; font-family: var(--fonte); transition: filter .15s, transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn-azul { background: var(--azul); color: white; }
  .btn-azul:hover { filter: brightness(1.1); }
  .btn-verde { background: var(--verde); color: white; }
  .btn-verde:hover { filter: brightness(1.1); }
  .btn-outline { background: white; color: var(--azul); border: 1px solid var(--cinza-borda); }
  .btn-outline:hover { background: var(--azul-light); }
  .btn-vermelho { background: var(--vermelho); color: white; }
  .btn-vermelho:hover { filter: brightness(1.1); }

  /* ── VAZIO ── */
  .empty-state { text-align: center; padding: 50px 20px; color: var(--cinza-texto); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: .4; }
  .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .empty-state p { font-size: 13px; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999; max-width: min(420px, calc(100vw - 48px));
    background: #1a1a2e; color: white; padding: 12px 18px; border-radius: 10px;
    font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    transform: translateY(80px); opacity: 0; transition: all .3s; pointer-events: none;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.sucesso { border-left: 4px solid #2fbf7a; }
  .toast.info    { border-left: 4px solid #5aa9f0; }
  .toast.erro    { border-left: 4px solid #ff6b5b; background: #3a1414; }

  /* ── EMPRESA ── */
  .empresa-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .empresa-tag { background: var(--azul-light); color: var(--azul); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; }

  /* ── HISTÓRICO ── */
  .historico-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-radius: 8px; background: var(--cinza-bg); border: 1px solid var(--cinza-borda);
    margin-bottom: 6px; font-size: 12px;
  }
  .historico-icone { font-size: 16px; }
  .historico-texto { flex: 1; color: var(--cinza-texto); }
  .historico-data { color: #7a8494; font-size: 11px; }

  /* ── LOGIN ── */
  .login-overlay {
    position: fixed; inset: 0; background: rgba(13,74,138,0.85);
    display: flex; align-items: center; justify-content: center; z-index: 99999;
    backdrop-filter: blur(3px); padding: 16px;
  }
  .login-box {
    background: white; border-radius: 14px; padding: 32px; width: 380px; max-width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 14px;
  }
  .login-logo { font-size: 20px; font-weight: 700; color: var(--azul-dark); text-align: center; }
  .login-logo span { color: #2e8fd6; }
  .login-box h2 { font-size: 16px; font-weight: 600; color: var(--azul); text-align: center; }
  .login-box > p { font-size: 12px; color: var(--cinza-texto); text-align: center; margin-top: -8px; }
  .login-msg { font-size: 12px; min-height: 16px; }
  .login-msg.erro { color: var(--vermelho); }
  .login-msg.ok { color: var(--verde); }
  .login-entrar { justify-content: center; width: 100%; }
  .link-btn { background: none; border: none; color: var(--azul); font-size: 12px; cursor: pointer; text-decoration: underline; font-family: var(--fonte); }
  .login-carregando { color: white; font-size: 14px; }

  /* ── USUÁRIO ATUAL ── */
  .usuario-atual {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; margin: 12px 10px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.08); font-size: 12px;
  }
  .usuario-atual .nome { color: white; font-weight: 600; }
  .usuario-atual .nome span { color: rgba(255,255,255,0.55); font-weight: 400; display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .usuario-trocar { background: none; border: none; color: rgba(255,255,255,0.65); font-size: 11px; cursor: pointer; text-decoration: underline; font-family: var(--fonte); }
  .usuario-trocar:hover { color: white; }

  /* ── PAINEL DE DOWNLOADS ── */
  .downloads-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
  .download-card {
    border: 1px solid var(--cinza-borda); border-radius: 10px; padding: 14px 16px;
    background: var(--cinza-bg); display: flex; align-items: center; gap: 12px;
  }
  .download-card .avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--azul);
    color: white; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; flex-shrink: 0;
  }
  .download-card .info .nome { font-size: 13px; font-weight: 600; color: #1a1a2e; }
  .download-card .info .qtd { font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.2; }
  .download-card .info .label { font-size: 10px; color: var(--cinza-texto); text-transform: uppercase; letter-spacing: 0.5px; }

  .download-log { max-height: 220px; overflow-y: auto; }
  .download-log-item {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px;
    border-radius: 7px; font-size: 12px; border-bottom: 1px solid #f0f3f8;
  }
  .download-log-item .tag {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
    background: var(--azul-light); color: var(--azul); text-transform: uppercase; white-space: nowrap;
  }
  .download-log-item .desc { flex: 1; color: #1a1a2e; }
  .download-log-item .data { color: #7a8494; font-size: 11px; white-space: nowrap; }
  .painel-rodape { display: flex; justify-content: flex-end; margin-top: 12px; }

  .sync-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(255,255,255,0.6); padding: 0 18px 4px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
  .sync-dot.off { background: #f87171; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { height: auto; position: relative; }
    .lista-orcamentos { max-height: 40vh; overflow-y: auto; }
    .main { padding: 16px; }
    .form-grid-2, .rodape-grid, .downloads-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-carregando" id="loginCarregando">Carregando…</div>
  <form class="login-box" id="loginForm" novalidate style="display:none">
    <div class="login-logo"><span style="display:inline-block;background:#1B1811;border-radius:8px;padding:12px 18px"><img id="logoLogin" alt="Elite Supply" style="width:160px;height:auto;display:block"></span></div>
    <h2>Entrar</h2>
    <p>Gerador de Orçamentos · acesso restrito à equipe</p>
    <div class="form-group">
      <label for="loginEmail">E-mail</label>
      <input id="loginEmail" type="email" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="loginSenha">Senha</label>
      <input id="loginSenha" type="password" autocomplete="current-password" required>
    </div>
    <div class="login-msg" id="loginMsg" role="alert" aria-live="polite"></div>
    <button type="submit" class="btn btn-azul login-entrar" id="btnEntrar">Entrar</button>
    <button type="button" class="link-btn" id="btnEsqueci">Esqueci minha senha / primeiro acesso</button>
  </form>
</div>

<div class="app">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1><img id="logoSidebar" alt="Elite Supply" style="width:150px; height:auto; display:block"></h1>
      <p style="margin-top:8px">Gerador de Orçamentos</p>
    </div>

    <div class="usuario-atual" id="usuarioAtualBox" style="display:none">
      <div class="nome"><span>Conectado como</span><span id="nomeUsuarioAtual"></span></div>
      <button class="usuario-trocar" id="btnSair" type="button">sair</button>
    </div>
    <div class="sync-status" id="syncStatus" aria-live="polite">
      <span class="sync-dot off" id="syncDot"></span>
      <span id="syncTexto">Conectando...</span>
    </div>

    <div class="sidebar-section">
      <h2>Novo orçamento</h2>
      <button class="btn-novo" id="btnNovo" type="button" disabled>
        <span aria-hidden="true">＋</span> Criar orçamento
      </button>
    </div>

    <div class="sidebar-section">
      <h2>Orçamentos</h2>
      <div class="filtros">
        <input type="search" id="filtroTexto" placeholder="Buscar cliente, nº ou CNPJ" aria-label="Buscar orçamentos">
        <select id="filtroStatus" aria-label="Filtrar por status">
          <option value="todos">Todos</option>
          <option value="rascunho">Rascunhos</option>
          <option value="baixado">Baixados</option>
          <option value="atualizado">Atualizados</option>
          <option value="lixeira">🗑 Lixeira</option>
        </select>
      </div>
      <div class="lista-contagem" id="listaContagem"></div>
    </div>
    <div class="lista-orcamentos" id="listaOrcamentos"></div>
    <div style="padding:0 18px 16px">

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function semAcento(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function membroPorEmail(email) {
  const e = String(email || '').trim().toLowerCase();
  return EQUIPE.find(m => m.email === e) || null;
}

// Aceita "Leonardo", "leonardo montiel", "Ana Carla" etc. (registros antigos guardavam texto livre)
function membroPorNome(nome) {
  const n = semAcento(nome).trim().toLowerCase();
  if (!n) return null;
  return EQUIPE.find(m => semAcento(m.nome).toLowerCase() === n)
      || EQUIPE.find(m => n.startsWith(semAcento(m.nome).toLowerCase() + ' '))
      || EQUIPE.find(m => n.split(/\s+/)[0] === semAcento(m.nome).toLowerCase().split(' ')[0])
      || null;
}

// Converte texto de preço em número. Aceita "1.234,56", "R$ 1.234,56", "1234,5", "1234.56", "1,234.56".
function parseMoeda(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v).replace(/[^\d,.]/g, '');
  if (!s) return 0;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) {
    const dec = lc > ld ? ',' : '.';
    const mil = dec === ',' ? '.' : ',';
    s = s.split(mil).join('').replace(dec, '.');
  } else if (lc > -1) {
    const p = s.split(',');
    s = p.length === 2 ? p[0] + '.' + p[1] : p.join('');
  } else if (ld > -1) {
    const p = s.split('.');
    if (p.length > 2 || p[1].length === 3) s = p.join(''); // "1.234" ou "1.234.567" = milhar
  }
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}

// Quantidade > 0, aceitando vírgula. Retorna NaN se inválida.
function parseQtde(v) {
  if (v === null || v === undefined || v === '') return NaN;
  const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
  return isFinite(n) && n > 0 ? n : NaN;
}

function formatMoeda(v) {
  return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatQtde(v) {
  const n = parseQtde(v);
  return isNaN(n) ? '' : n.toLocaleString('pt-BR', { maximumFractionDigits: 3 });
}

// "2026-10-30" é formatado direto (sem new Date, que interpreta como UTC e voltaria 1 dia no Brasil)
function formatarData(v) {
  if (!v) return '—';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v));
  if (m) return `${m[3]}/${m[2]}/${m[1]}`;
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  return d.toLocaleDateString('pt-BR');
}

function romano(n) {
  const t = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let r = '';
  for (const [v, s] of t) while (n >= v) { r += s; n -= v; }
  return r;
}

function labelOrcamento(orc) {
  if (!orc.revisao) return `Cotação ${orc.numeroBase}`;
  return `Cotação ${orc.numeroBase} — Atualização ${orc.revisao <= 30 ? romano(orc.revisao) : orc.revisao}`;
}

function linhaTemConteudo(i) {
  return ['referencia', 'descricao', 'unitario', 'entrega', 'faturadoPor']
    .some(k => String(i[k] ?? '').trim() !== '');
}

function totalItem(item) {
  const u = parseMoeda(item.unitario), q = parseQtde(item.qtde);
  return u > 0 && q > 0 ? u * q : 0;
}

function subtotalItens(orc) {
  return (orc.itens || []).reduce((a, i) => a + totalItem(i), 0);
}

const FRETES = [
  { v: 'cif',      label: 'CIF — frete incluso no preço',   pdf: 'CIF (incluso no preço)' },
  { v: 'fob',      label: 'FOB — por conta do cliente',     pdf: 'FOB (por conta do cliente)' },
  { v: 'valor',    label: 'Cobrado à parte (informar valor)', pdf: null },
  { v: 'combinar', label: 'A combinar',                     pdf: 'A combinar' },
];

function valorFrete(orc) {
  return orc.freteTipo === 'valor' ? parseMoeda(orc.freteValor) : 0;
}

function textoFrete(orc) {
  if (orc.freteTipo === 'valor') return `${orc.moeda || 'R$'} ${formatMoeda(valorFrete(orc))}`;
  const f = FRETES.find(x => x.v === orc.freteTipo);
  return f ? f.pdf : '—';
}

function totalCotacao(orc) {
  return subtotalItens(orc) + valorFrete(orc);
}

function moedasMistas(orc) {
  return (orc.itens || []).some(i => i.moeda && i.moeda !== orc.moeda && linhaTemConteudo(i));
}

function validarParaPDF(orc) {
  const erros = [];
  if (!String(orc.cliente || '').trim()) erros.push('Informe o nome do cliente.');
  const linhas = (orc.itens || []).map((it, idx) => ({ it, n: idx + 1 })).filter(x => linhaTemConteudo(x.it));
  if (linhas.length === 0) erros.push('Inclua ao menos um item na cotação.');
  linhas.forEach(({ it, n }) => {
    if (!String(it.descricao || '').trim()) erros.push(`Linha ${n}: falta a descrição do produto.`);
    if (isNaN(parseQtde(it.qtde))) erros.push(`Linha ${n}: quantidade inválida.`);
    if (!(parseMoeda(it.unitario) > 0)) erros.push(`Linha ${n}: valor unitário inválido.`);
  });
  if (!orc.freteTipo) erros.push('Informe o frete (CIF, FOB, valor à parte ou a combinar).');
  else if (orc.freteTipo === 'valor' && !(parseMoeda(orc.freteValor) > 0)) erros.push('Informe o valor do frete.');
  if (moedasMistas(orc)) erros.push('Há itens em moedas diferentes (cotação antiga). Confirme a moeda da cotação no seletor acima da tabela; se forem moedas diferentes, faça duas cotações.');
  return erros;
}

function nomeArquivo(orc) {
  const base = `${labelOrcamento(orc)} ${orc.cliente || 'cliente'}`;
  return semAcento(base)
    .replace(/[—–]/g, '-')
    .replace(/[\\/:*?"<>|]+/g, ' ')
    .trim()
    .replace(/\s+/g, '_')
    .replace(/_*-_*/g, '-')
    .replace(/[^\w.\-]/g, '')
    .slice(0, 120)
    .replace(/[._-]+$/, '') + '.pdf';
}

// ════════════════════════════════════════════
//  CNPJ: validação e leitura das respostas das APIs
// ════════════════════════════════════════════
function cnpjValido(c) {
  c = String(c || '').replace(/\D/g, '');
  if (!/^\d{14}$/.test(c) || /^(\d)\1{13}$/.test(c)) return false;
  const dv = n => {
    const pesos = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    const r = pesos.reduce((a, p, i) => a + Number(c[i]) * p, 0) % 11;
    return r < 2 ? 0 : 11 - r;
  };
  return dv(12) === Number(c[12]) && dv(13) === Number(c[13]);
}

function formatarCep(v) {
  const d = String(v || '').replace(/\D/g, '');
  return d.length === 8 ? `${d.slice(0, 5)}-${d.slice(5)}` : String(v || '');
}

function formatarTelefone(v) {
  const d = String(v || '').replace(/\D/g, '');
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return String(v || '');
}

function titulo(s) {
  // "BENTO GONCALVES" -> "Bento Goncalves"; mantém siglas curtas como "RS"
  return String(s || '').toLowerCase().replace(/(^|[\s\/(-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase())
    .replace(/(?<=\s)(Da|De|Do|Das|Dos|E)(?=\s)/g, w => w.toLowerCase());
}

// Converte a resposta de qualquer uma das APIs para um formato único
function lerDadosCnpj(fonte, d) {
  if (!d) return null;
  if (fonte === 'cnpjws') {
    const e = d.estabelecimento || {};
    return {
      razao: d.razao_social || '', fantasia: e.nome_fantasia || '',
      tipo: e.tipo_logradouro || '', logradouro: e.logradouro || '', numero: e.numero || '',
      complemento: e.complemento || '', bairro: e.bairro || '',
      municipio: (e.cidade && e.cidade.nome) || '', uf: (e.estado && e.estado.sigla) || '',
      cep: e.cep || '', telefone: e.ddd1 && e.telefone1 ? `${e.ddd1}${e.telefone1}` : '',
      email: e.email || '', situacao: e.situacao_cadastral || '',
    };
  }
  // BrasilAPI e Minha Receita usam o mesmo formato
  return {
    razao: d.razao_social || '', fantasia: d.nome_fantasia || '',
    tipo: d.descricao_tipo_de_logradouro || d.descricao_tipo_logradouro || '',
    logradouro: d.logradouro || '', numero: d.numero || '', complemento: d.complemento || '',
    bairro: d.bairro || '', municipio: d.municipio || '', uf: d.uf || '', cep: d.cep || '',
    telefone: d.ddd_telefone_1 || '', email: d.email || '', situacao: d.descricao_situacao_cadastral || '',
  };
}

function montarEnderecoCnpj(x) {
  const partes = [];
  if (x.logradouro) {
    const tipo = x.tipo && !String(x.logradouro).toUpperCase().startsWith(String(x.tipo).toUpperCase()) ? x.tipo + ' ' : '';
    partes.push(`${titulo(tipo + x.logradouro)}, ${x.numero || 's/n'}`);
  }
  if (x.complemento) partes.push(titulo(x.complemento));
  if (x.bairro) partes.push(titulo(x.bairro));
  if (x.municipio) partes.push(`${titulo(x.municipio)}/${String(x.uf || '').toUpperCase()}`);
  if (x.cep) partes.push(`CEP ${formatarCep(x.cep)}`);
  return partes.join(' — ');
}

// ════════════════════════════════════════════
//  PDF
// ════════════════════════════════════════════
function rotuloProposta(orc) {
  return `Nº ${orc.numeroBase}` + (orc.revisao ? ` · Atualização ${orc.revisao <= 30 ? romano(orc.revisao) : orc.revisao}` : '');
}

function textoPrazo(v) {
  const s = String(v ?? '').trim();
  if (!s) return '—';
  return /^\d+$/.test(s) ? `${s} ${s === '1' ? 'dia útil' : 'dias úteis'}` : s;
}

// fontes: { normal, semibold, bold } em base64 (Montserrat) ou null para usar Helvetica
function montarPDF(orc, jsPDF, fontes) {
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const W = 210, H = 297, M = 14, CW = W - 2 * M;
  const PRETO = [27, 24, 17], AZUL = [16, 108, 255], AZUL_CLARO = [111, 166, 255], AZUL_FUNDO = [238, 244, 255], AZUL_ESCURO = [11, 79, 192];
  const TEXTO = [51, 51, 51], CINZA = [119, 119, 119], CINZA_CLARO = [153, 153, 153], LINHA = [231, 231, 231], BRANCO = [255, 255, 255];
  const RODAPE = 10, TOPO_CONT = 26;

  let FAM = 'helvetica';
  if (fontes && fontes.normal && fontes.semibold && fontes.bold) {
    try {
      doc.addFileToVFS('Montserrat-400.ttf', fontes.normal); doc.addFont('Montserrat-400.ttf', 'Montserrat', 'normal');
      doc.addFileToVFS('Montserrat-600.ttf', fontes.semibold); doc.addFont('Montserrat-600.ttf', 'Montserrat', 'semibold');
      doc.addFileToVFS('Montserrat-700.ttf', fontes.bold); doc.addFont('Montserrat-700.ttf', 'Montserrat', 'bold');
      FAM = 'Montserrat';
    } catch (e) { FAM = 'helvetica'; }
  }
  const estilo = s => FAM === 'helvetica' && s === 'semibold' ? 'bold' : s;
  const fonte = (s, tam, cor) => { doc.setFont(FAM, estilo(s)); doc.setFontSize(tam); if (cor) doc.setTextColor(...cor); };

  const vend = membroPorNome(orc.vendedor);
  const consultor = vend || { nome: orc.vendedor || EMPRESA.nome, email: EMPRESA.email, tel: EMPRESA.tel };
  const moeda = orc.moeda || 'R$';
  const emitida = new Date().toLocaleDateString('pt-BR');
  const linhasItens = (orc.itens || []).filter(linhaTemConteudo);
  const temFreteValor = orc.freteTipo === 'valor' && valorFrete(orc) > 0;

  function cortar(txt, maxW) {
    const s = String(txt || '').replace(/\s+/g, ' ').trim();
    if (!s || doc.getTextWidth(s) <= maxW) return s;
    let l = s;
    while (l.length > 1 && doc.getTextWidth(l + '…') > maxW) l = l.slice(0, -1);
    return l.trimEnd() + '…';
  }
  function quebrar(txt, maxW, maxLinhas) {
    const ls = doc.splitTextToSize(String(txt || '').trim(), maxW);
    if (!maxLinhas || ls.length <= maxLinhas) return ls;
    const r = ls.slice(0, maxLinhas);
    r[maxLinhas - 1] = cortar(r[maxLinhas - 1] + ' ' + ls.slice(maxLinhas).join(' '), maxW);
    return r;
  }
  function rotulo(txt, x, y, cor = AZUL) {
    fonte('semibold', 6.5, cor);
    doc.text(txt.toUpperCase(), x, y, { charSpace: 0.25 });
  }
  const wa = tel => 'https://wa.me/55' + String(tel || '').replace(/\D/g, '');

  // Logo oficial; se a imagem falhar por algum motivo, escreve o nome com a fonte
  function marca(x, yTopo, largura) {
    try {
      doc.addImage(LOGO_BRANCO, 'PNG', x, yTopo, largura, largura / LOGO_PROPORCAO, 'logo-elite', 'FAST');
    } catch (e) {
      fonte('semibold', largura * 0.5, BRANCO);
      doc.text('Elite', x, yTopo + largura / LOGO_PROPORCAO * 0.85);
    }
  }

  function cabecalhoCompleto() {
    doc.setFillColor(...PRETO); doc.rect(0, 0, W, 30, 'F');
    doc.setFillColor(...AZUL); doc.rect(0, 30, W, 1.2, 'F');
    marca(M, 9, 50);
    fonte('semibold', 7, AZUL_CLARO);
    doc.text('PROPOSTA COMERCIAL', W - M, 11.5, { align: 'right' });
    fonte('semibold', 13, BRANCO);
    doc.text(rotuloProposta(orc), W - M, 18.5, { align: 'right' });
    fonte('normal', 7.5, [221, 221, 221]);
    doc.text(`Emitida em ${emitida}`, W - M, 24, { align: 'right' });
  }

  function cabecalhoContinuacao() {
    doc.setFillColor(...PRETO); doc.rect(0, 0, W, 18, 'F');
    doc.setFillColor(...AZUL); doc.rect(0, 18, W, 0.9, 'F');
    marca(M, 5, 30);
    fonte('semibold', 8.5, BRANCO);
    doc.text(`Proposta comercial ${rotuloProposta(orc)}`, W - M, 9, { align: 'right' });
    fonte('normal', 7, [221, 221, 221]);
    doc.text(cortar(orc.cliente, 90), W - M, 13.5, { align: 'right' });
  }

  function novaPagina() {
    doc.addPage();
    cabecalhoContinuacao();
    return TOPO_CONT;
  }
  const LIMITE = H - RODAPE - 6;
  const garantirEspaco = (y, altura) => (y + altura > LIMITE ? novaPagina() : y);

  // ── Página 1: cabeçalho + cliente + consultor ──
  cabecalhoCompleto();
  let y = 39;
  const xDir = 134, wEsq = xDir - M - 8, wDir = W - M - xDir - 4;

  rotulo('Preparada para', M, y);
  fonte('semibold', 11, PRETO);
  const nomeCli = quebrar(orc.cliente || '—', wEsq, 2);
  doc.text(nomeCli, M, y + 5.5, { lineHeightFactor: 1.2 });
  let ye = y + 5.5 + (nomeCli.length - 1) * 4.7 + 4.8;
  fonte('normal', 7.8, CINZA);
  const infoCli = [];
  if (orc.cnpj) infoCli.push(`CNPJ ${orc.cnpj}`);
  const ac = [orc.contato ? `A/C ${orc.contato}` : '', orc.email].filter(Boolean).join(' · ');
  if (ac) infoCli.push(ac);
  if (orc.telefone) infoCli.push(orc.telefone);
  infoCli.forEach(l => { doc.text(cortar(l, wEsq), M, ye); ye += 3.7; });
  if (orc.enderecoCliente) {
    quebrar(orc.enderecoCliente, wEsq, 2).forEach(l => { doc.text(l, M, ye); ye += 3.7; });
  }

  doc.setFillColor(...AZUL); doc.rect(xDir, y - 3, 0.9, 22, 'F');
  rotulo('Seu consultor', xDir + 4, y);
  fonte('semibold', 10.5, PRETO);
  doc.text(cortar(consultor.nome, wDir), xDir + 4, y + 5.5);
  fonte('normal', 7.8, TEXTO);
  doc.text(`WhatsApp ${consultor.tel}`, xDir + 4, y + 10.5);
  doc.link(xDir + 4, y + 8, wDir, 3.6, { url: wa(consultor.tel) });
  doc.text(cortar(consultor.email, wDir), xDir + 4, y + 14.5);
  doc.link(xDir + 4, y + 12, wDir, 3.6, { url: 'mailto:' + consultor.email });

  y = Math.max(ye, y + 20) + 5;

  // ── Tabela de itens ──
  const larg = { n: 6, ref: 18, fat: 28, qtd: 10, prazo: 15, unit: 23, total: 25 };
  larg.prod = CW - larg.n - larg.ref - larg.fat - larg.qtd - larg.prazo - larg.unit - larg.total;
  const PAD = 1.8;
  const corpo = linhasItens.map((it, i) => {
    const t = totalItem(it);
    const p = String(it.entrega ?? '').trim();
    return {
      n: String(i + 1),
      ref: it.referencia || '—',
      prod: it.descricao || '—',
      fat: it.faturadoPor || '—',
      qtd: formatQtde(it.qtde),
      prazo: !p ? '—' : /^\d+$/.test(p) ? `${p} ${p === '1' ? 'dia' : 'dias'}` : p,
      unit: formatMoeda(parseMoeda(it.unitario)),
      total: t ? formatMoeda(t) : '',
    };
  });

  doc.autoTable({
    startY: y,
    margin: { top: TOPO_CONT, left: M, right: M, bottom: RODAPE + 6 },
    theme: 'plain',
    columns: [
      { header: '#', dataKey: 'n' },
      { header: 'Referência', dataKey: 'ref' },
      { header: 'Produto', dataKey: 'prod' },
      { header: 'Qtd', dataKey: 'qtd' },
      { header: 'Entrega', dataKey: 'prazo' },
      { header: `Unitário (${moeda})`, dataKey: 'unit' },
      { header: `Total (${moeda})`, dataKey: 'total' },
      { header: 'Faturado por', dataKey: 'fat' },
    ],
    body: corpo,
    showHead: 'everyPage',
    styles: { font: FAM, fontSize: 7.6, textColor: TEXTO, cellPadding: { top: 2.8, bottom: 2.8, left: PAD, right: PAD }, valign: 'middle', lineHeightFactor: 1.25, overflow: 'linebreak' },
    headStyles: { fillColor: PRETO, textColor: BRANCO, fontStyle: estilo('semibold'), fontSize: 6.8, cellPadding: { top: 2.6, bottom: 2.6, left: PAD, right: PAD } },
    alternateRowStyles: { fillColor: [250, 250, 250] },
    columnStyles: {
      n: { cellWidth: larg.n, halign: 'center', textColor: AZUL, fontStyle: estilo('semibold') },
      ref: { cellWidth: larg.ref, fontSize: 7, textColor: CINZA },
      prod: { cellWidth: larg.prod, fontStyle: estilo('semibold'), textColor: PRETO },
      fat: { cellWidth: larg.fat, fontSize: 7, textColor: CINZA, cellPadding: { top: 2.8, bottom: 2.8, left: 4, right: PAD } },
      qtd: { cellWidth: larg.qtd, halign: 'center' },
      prazo: { cellWidth: larg.prazo, halign: 'center', fontSize: 7.2 },
      unit: { cellWidth: larg.unit, halign: 'right' },
      total: { cellWidth: larg.total, halign: 'right', fontStyle: estilo('bold'), textColor: PRETO },
    },
    didParseCell: d => {
      if (d.section === 'head' && ['qtd', 'prazo', 'n'].includes(d.column.dataKey)) d.cell.styles.halign = 'center';
      if (d.section === 'head' && ['unit', 'total'].includes(d.column.dataKey)) d.cell.styles.halign = 'right';
    },
    didDrawCell: d => {
      if (d.section !== 'body') return;
      doc.setDrawColor(...LINHA); doc.setLineWidth(0.25);
      doc.line(d.cell.x, d.cell.y + d.cell.height, d.cell.x + d.cell.width, d.cell.y + d.cell.height);
    },
    didDrawPage: d => { if (d.pageNumber > 1) cabecalhoContinuacao(); },
  });
  fonte('normal', 6.5, CINZA_CLARO);
  doc.text('Prazos de entrega em dias úteis.', W - M, doc.lastAutoTable.finalY + 3.5, { align: 'right' });

  // ── Resumo: condições + investimento ──
  y = doc.lastAutoTable.finalY + 7;
  const altResumo = 38;
  y = garantirEspaco(y, altResumo);
  const xCaixa = W - M - 64, wCaixa = 64;

  const cond = [
    ['Validade da proposta', orc.validade ? formatarData(orc.validade) : '—', true],
    ['Condição de pagamento', orc.condicaoPagamento || '—'],
    ['Forma de pagamento', orc.formaPagamento || '—'],
    ['Frete', textoFrete(orc)],
  ];
  if (String(orc.garantia || '').trim()) cond.push(['Garantia', orc.garantia]);
  if (moeda !== 'R$') cond.push(['Moeda', `Valores em ${moeda}`]);
  const wCol = (xCaixa - M - 8) / 2;
  cond.forEach(([l, v, destaque], i) => {
    const cx = M + (i % 2) * (wCol + 6), cy = y + 3 + Math.floor(i / 2) * 10.5;
    rotulo(l, cx, cy, CINZA);
    fonte('semibold', 8.5, destaque && v !== '—' ? AZUL_ESCURO : PRETO);
    doc.text(cortar(v, wCol), cx, cy + 4.6);
  });

  const hCaixa = temFreteValor ? 34 : 24;
  doc.setFillColor(...PRETO);
  doc.roundedRect(xCaixa, y - 1, wCaixa, hCaixa, 1.8, 1.8, 'F');
  let by = y + 5;
  if (temFreteValor) {
    fonte('normal', 7.8, [187, 187, 187]);
    doc.text('Subtotal', xCaixa + 5, by);
    doc.text(`${moeda} ${formatMoeda(subtotalItens(orc))}`, xCaixa + wCaixa - 5, by, { align: 'right' });
    by += 4.6;
    doc.text('Frete', xCaixa + 5, by);
    doc.text(`${moeda} ${formatMoeda(valorFrete(orc))}`, xCaixa + wCaixa - 5, by, { align: 'right' });
    by += 2.6;
    doc.setDrawColor(68, 68, 68); doc.setLineWidth(0.25);
    doc.line(xCaixa + 5, by, xCaixa + wCaixa - 5, by);
    by += 5;
  } else {
    by += 1;
  }
  rotulo('Investimento total', xCaixa + 5, by, AZUL_CLARO);
  fonte('bold', 15, BRANCO);
  doc.text(`${moeda} ${formatMoeda(totalCotacao(orc))}`, xCaixa + 5, by + 7.5);
  y = Math.max(y - 1 + hCaixa, y + Math.ceil(cond.length / 2) * 10.5) + 7;

  // ── Observações (sempre presente; "—" quando vazia) ──
  const obs = String(orc.observacoes || '').trim() || '—';
  {
    fonte('normal', 7.6);
    const ls = [];
    obs.split(/\r?\n/).forEach(p => ls.push(...(p.trim() ? doc.splitTextToSize(p.trim(), CW) : [''])));
    y = garantirEspaco(y, Math.min(ls.length, 4) * 3.6 + 6);
    rotulo('Observações', M, y);
    y += 4.5;
    fonte('normal', 7.6, TEXTO);
    ls.forEach(l => {
      if (y > LIMITE) { y = novaPagina(); fonte('normal', 7.6, TEXTO); }
      doc.text(l, M, y);
      y += 3.6;
    });
    y += 4;
  }

  // ── Diferenciais ──
  y = garantirEspaco(y, 20);
  doc.setDrawColor(...LINHA); doc.setLineWidth(0.3);
  doc.line(M, y, W - M, y);
  const difs = [
    ['Entrega rápida', 'para todo o Brasil'],
    ['Atendimento', 'especializado'],
    ['Produtos originais', 'com NF do distribuidor'],
    ['Condições especiais', 'para CNPJ'],
  ];
  const wd = CW / difs.length;
  difs.forEach(([a, b], i) => {
    const cx = M + wd * i + wd / 2, cy = y + 6;
    doc.setDrawColor(...AZUL); doc.setLineWidth(0.45);
    doc.circle(cx, cy, 2.6, 'S');
    doc.setLineWidth(0.55);
    doc.line(cx - 1.15, cy + 0.05, cx - 0.25, cy + 0.95);
    doc.line(cx - 0.25, cy + 0.95, cx + 1.3, cy - 0.85);
    fonte('semibold', 7.2, PRETO);
    doc.text(a, cx, cy + 6.6, { align: 'center' });
    fonte('normal', 6.8, CINZA);
    doc.text(b, cx, cy + 9.8, { align: 'center' });
  });
  y += 19;
  doc.setDrawColor(...LINHA); doc.setLineWidth(0.3);
  doc.line(M, y, W - M, y);
  y += 7;

  // ── Como aprovar + aceite ──
  y = garantirEspaco(y, 20);
  const wMeia = (CW - 12) / 2;

  const la = doc.splitTextToSize(textoAprovar, wMeia);
  doc.text(la, M, y + 4.6, { lineHeightFactor: 1.35 });
  doc.link(M, y + 1.5, wMeia, la.length * 3.8 + 1, { url: wa(consultor.tel) });

  const xa = M + wMeia + 12;
  rotulo('De acordo', xa, y);
  doc.setDrawColor(153, 153, 153); doc.setLineWidth(0.3);
  doc.line(xa, y + 11, W - M, y + 11);

  doc.text('Nome · cargo · data', xa, y + 14.5);

    doc.text(`${EMPRESA.nome} · CNPJ ${EMPRESA.cnpj} · ${EMPRESA.endereco.replace(' — ', ', ')}`, M, H - 4);

    doc.link(W - M - 60, H - 7, 30, 4, { url: 'https://elitesupply.com.br' });
  }
  return doc;
}

function mostrarLogin(msg, tipo = 'erro') {
  $('loginOverlay').style.display = 'flex';
  $('loginCarregando').style.display = 'none';
  $('loginForm').style.display = 'flex';
  $('usuarioAtualBox').style.display = 'none';
  const m = msg || msgLoginPendente;
  msgLoginPendente = null;
  setLoginMsg(m || '', tipo);
  setTimeout(() => $('loginEmail').focus(), 50);
}

function setLoginMsg(txt, tipo) {
  const el = $('loginMsg');
  el.textContent = txt;
  el.className = 'login-msg ' + (tipo || '');
}

function mensagemErroAuth(e) {
  switch (e && e.code) {
    case 'auth/invalid-credential':
    case 'auth/invalid-login-credentials':
    case 'auth/wrong-password':
    case 'auth/user-not-found': return 'E-mail ou senha incorretos.';
    case 'auth/invalid-email': return 'E-mail inválido.';
    case 'auth/too-many-requests': return 'Muitas tentativas. Aguarde alguns minutos ou use "Esqueci minha senha".';
    case 'auth/network-request-failed': return 'Sem conexão com a internet.';
    case 'auth/user-disabled': return 'Este acesso foi desativado.';
    default: return 'Não foi possível entrar. ' + ((e && e.message) || '');
  }
}

async function entrar(ev) {
  ev.preventDefault();
  const email = $('loginEmail').value.trim().toLowerCase();
  const senha = $('loginSenha').value;
  if (!membroPorEmail(email)) { setLoginMsg('Este e-mail não tem acesso ao sistema.', 'erro'); return; }
  if (!senha) { setLoginMsg('Digite a senha.', 'erro'); return; }
  $('btnEntrar').disabled = true;
  setLoginMsg('Entrando…', '');
  try {
    await auth.signInWithEmailAndPassword(email, senha);
    $('loginSenha').value = '';
  } catch (e) {
    console.error(e);
    setLoginMsg(mensagemErroAuth(e), 'erro');
  } finally {
    $('btnEntrar').disabled = false;
  }
}

async function esqueciSenha() {
  const email = $('loginEmail').value.trim().toLowerCase();
  if (!email) { setLoginMsg('Digite seu e-mail acima e clique novamente.', 'erro'); $('loginEmail').focus(); return; }
  if (!membroPorEmail(email)) { setLoginMsg('Este e-mail não tem acesso ao sistema.', 'erro'); return; }
  try {
    await auth.sendPasswordResetEmail(email);
    setLoginMsg(`Enviamos um link para ${email} para criar/redefinir a senha. Confira também o spam.`, 'ok');
  } catch (e) {
    console.error(e);
    setLoginMsg(mensagemErroAuth(e), 'erro');
  }
}

// ════════════════════════════════════════════
//  SINCRONIZAÇÃO EM TEMPO REAL
// ════════════════════════════════════════════
function pararListeners() {
  unsubs.forEach(u => { try { u(); } catch {} });
  unsubs = [];
}

function iniciarListeners() {
  marcarConectado(false, 'Conectando...');
  unsubs.push(colOrc().onSnapshot({ includeMetadataChanges: true }, onOrcamentos, err => {
    console.error(err);
    marcarConectado(false);
    if (err.code === 'permission-denied') toast('Sem permissão para ler os orçamentos. Confira as regras do Firestore.', 'erro');
  }));
  unsubs.push(db.collection('downloads').orderBy('timestamp', 'desc').limit(50).onSnapshot(s => {
    downloads = s.docs.map(d => d.data({ serverTimestamps: 'estimate' }));
    renderDownloadsPanel();
  }, err => console.error(err)));
  unsubs.push(refStats().onSnapshot(s => {
    if (!s.exists) { migrarStats(); return; }
    stats = s.data();
    renderDownloadsPanel();
  }, err => console.error(err)));
}

function normalizar(o) {
  o.itens = Array.isArray(o.itens) && o.itens.length ? o.itens : [linhaVazia()];
  o.historico = Array.isArray(o.historico) ? o.historico : [];
  o.numeroBase = Number(o.numeroBase) || 0;
  o.revisao = Number(o.revisao) || 0;
  o.status = o.status || 'rascunho';
  o.excluido = !!o.excluido;
  o.freteTipo = o.freteTipo || '';
  o.freteValor = o.freteValor || '';
  if (o.garantia === undefined) o.garantia = 'Conforme fabricante';
  if (!o.moeda) {
    const comMoeda = o.itens.find(i => i.moeda && linhaTemConteudo(i)) || o.itens.find(i => i.moeda);
    o.moeda = (comMoeda && comMoeda.moeda) || 'R$';
  }
  return o;
}

function ordenar() {
  orcamentos.sort((a, b) => (a.numeroBase - b.numeroBase) || (a.revisao - b.revisao));
}

function onOrcamentos(snapshot) {
  // Mudança no orçamento aberto feita por OUTRA pessoa (ou outra aba)?
  let remoto = false, autor = '';
  snapshot.docChanges({ includeMetadataChanges: false }).forEach(ch => {
    if (ch.doc.id === orcamentoAtivo && ch.type === 'modified' && !ch.doc.metadata.hasPendingWrites) {
      const d = ch.doc.data();
      if (d.atualizadoPor !== usuarioAtual?.nome || d.atualizadoEm !== ultimaGravacaoPropria[ch.doc.id]) {
        remoto = true; autor = d.atualizadoPor || '';
      }
    }
  });

  orcamentos = snapshot.docs.map(d => {
    const o = normalizar({ ...d.data(), id: d.id });
    if (pendentes[o.id]) Object.assign(o, pendentes[o.id]); // não perde o que ainda está sendo digitado
    return o;
  });
  ordenar();

  const primeiro = !carregado;
  carregado = true;
  $('btnNovo').disabled = false;
  marcarConectado(!snapshot.metadata.fromCache);

  if (snapshot.docChanges().length === 0 && !primeiro) return; // só mudou metadado
  renderSidebar();

  if (orcamentoAtivo && !getAtivo()) {
    orcamentoAtivo = null;
    renderEditor();
    toast('A cotação aberta foi removida.', 'info');
  } else if (remoto) {
    renderEditor(true);
    if (autor && autor !== usuarioAtual?.nome && Date.now() - ultimoAvisoRemoto > 8000) {
      ultimoAvisoRemoto = Date.now();
      toast(`${autor} alterou esta cotação agora.`, 'info');
    }
  } else if (primeiro) {
    renderEditor();
  }
}

function marcarConectado(ok, texto) {
  const dot = $('syncDot'), txt = $('syncTexto');
  if (!dot) return;
  dot.classList.toggle('off', !ok);
  txt.textContent = texto || (ok ? 'Sincronizado em tempo real' : 'Sem conexão — alterações serão enviadas ao reconectar');
}

// Conta downloads antigos uma única vez, para iniciar os contadores
async function migrarStats() {
  if (migrandoStats) return;
  migrandoStats = true;
  try {
    const todos = await db.collection('downloads').get();
    const contagem = {};
    EQUIPE.forEach(m => contagem[m.id] = 0);
    todos.forEach(d => {
      const v = d.data();
      const m = (v.vendedorId && EQUIPE.find(x => x.id === v.vendedorId)) || membroPorNome(v.vendedor);
      if (m) contagem[m.id]++;
    });
    await db.runTransaction(async t => {
      const s = await t.get(refStats());
      if (s.exists) return;
      t.set(refStats(), { contagem, migradoEm: agora() });
    });
  } catch (e) {
    console.error(e);
    migrandoStats = false;
  }
}

// ════════════════════════════════════════════
//  GRAVAÇÃO (só os campos alterados, com atraso curto)
// ════════════════════════════════════════════

function agendar(id, patch) {
  pendentes[id] = { ...(pendentes[id] || {}), ...patch };
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => gravar(id), 600);
  atualizarSaveState();
}

async function gravar(id) {
  clearTimeout(timers[id]);
  delete timers[id];
  const patch = pendentes[id];
  if (!patch) return;
  delete pendentes[id];
  const marca = agora();
  ultimaGravacaoPropria[id] = marca;
  gravando++;
  atualizarSaveState();
  try {
    await colOrc().doc(id).update({ ...patch, atualizadoEm: marca, atualizadoPor: usuarioAtual.nome });
    erroGravacao = false;
  } catch (e) {
    console.error(e);
    pendentes[id] = { ...patch, ...(pendentes[id] || {}) };
    erroGravacao = true;
    toast('Erro ao salvar na nuvem. Verifique a conexão.', 'erro');
    timers[id] = setTimeout(() => gravar(id), 5000);
  } finally {
    gravando--;
    atualizarSaveState();
  }
}

function gravarTodos() {
  return Promise.all(Object.keys(pendentes).map(gravar));
}

function atualizarSaveState() {
  const el = $('saveState');
  if (!el) return;
  if (erroGravacao) { el.className = 'save-state erro'; el.textContent = '⚠ Não salvo'; return; }
  if (Object.keys(pendentes).length || gravando) { el.className = 'save-state salvando'; el.textContent = 'Salvando…'; return; }
  el.className = 'save-state salvo'; el.textContent = '✓ Salvo';
}

window.addEventListener('beforeunload', e => {
  if (Object.keys(pendentes).length || gravando) {
    gravarTodos();
    e.preventDefault();
    e.returnValue = '';
  }
});

//  MODELO
// ════════════════════════════════════════════
function gerarId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function linhaVazia() {
  return { id: gerarId(), referencia: '', descricao: '', qtde: 1, unitario: '', entrega: '', faturadoPor: '' };
}

function getAtivo() {
  return orcamentos.find(o => o.id === orcamentoAtivo);
}

function estaBloqueado(orc) {
  return orc.excluido || orc.status !== 'rascunho';
}

function adicionarHistorico(orc, icone, texto) {
  orc.historico = [{ icone, texto, data: new Date().toLocaleString('pt-BR') }, ...(orc.historico || [])];
}

async function novoOrcamento() {
  if (!carregado || !usuarioAtual) return;
  const btn = $('btnNovo');
  btn.disabled = true;
  try {
    const maxLocal = orcamentos.reduce((m, o) => Math.max(m, o.numeroBase || 0), 0);
    const orc = await db.runTransaction(async t => {
      const s = await t.get(refContador());
      const ultimo = Math.max(s.exists ? Number(s.data().ultimo) || 0 : 0, maxLocal);
      const num = ultimo + 1;
      const ref = colOrc().doc(`c${num}r0`);
      if ((await t.get(ref)).exists) throw new Error('conflito');
      const novo = {
        id: ref.id, numeroBase: num, revisao: 0, status: 'rascunho', excluido: false,
        criadoEm: agora(), atualizadoEm: agora(), criadoPor: usuarioAtual.nome, atualizadoPor: usuarioAtual.nome,
        cliente: '', cnpj: '', contato: '', email: '', telefone: '', enderecoCliente: '',
        validade: '', condicaoPagamento: '', formaPagamento: '', observacoes: '',
        vendedor: usuarioAtual.nome, moeda: 'R$', freteTipo: '', freteValor: '', garantia: 'Conforme fabricante',
        itens: [linhaVazia()], historico: [],
      };
      adicionarHistorico(novo, '🆕', `Criada por ${usuarioAtual.nome}`);
      t.set(refContador(), { ultimo: num }, { merge: true });
      t.set(ref, novo);
      return novo;
    });
    if (!orcamentos.find(o => o.id === orc.id)) { orcamentos.push(normalizar({ ...orc })); ordenar(); }
    $('filtroStatus').value = 'todos';
    abrirOrcamento(orc.id);
    toast(`${labelOrcamento(orc)} criada!`, 'sucesso');
    setTimeout(() => { const c = $('f_cliente'); if (c) c.focus(); }, 50);
  } catch (e) {
    console.error(e);
    toast('Não foi possível criar a cotação. Verifique a conexão e tente de novo.', 'erro');
  } finally {
    btn.disabled = false;
  }
}

async function criarAtualizacao() {
  const orc = getAtivo();
  if (!orc || orc.excluido) return;
  gravarTodos();
  const rev = Math.max(...orcamentos.filter(o => o.numeroBase === orc.numeroBase).map(o => o.revisao)) + 1;
  try {
    const nova = await db.runTransaction(async t => {
      const ref = colOrc().doc(`c${orc.numeroBase}r${rev}`);
      if ((await t.get(ref)).exists) throw new Error('conflito');
      const n = JSON.parse(JSON.stringify(orc));
      delete n.excluidoEm; delete n.excluidoPor;
      Object.assign(n, {
        id: ref.id, revisao: rev, status: 'rascunho', excluido: false,
        criadoEm: agora(), atualizadoEm: agora(), criadoPor: usuarioAtual.nome, atualizadoPor: usuarioAtual.nome,
        historico: [],
      });
      adicionarHistorico(n, '✏️', `Criada por ${usuarioAtual.nome} a partir da ${labelOrcamento(orc)}`);
      t.set(ref, n);
      if (orc.status === 'baixado') {
        const hist = [{ icone: '🔁', texto: `Substituída pela ${labelOrcamento(n)} (${usuarioAtual.nome})`, data: new Date().toLocaleString('pt-BR') }, ...orc.historico];
        t.update(colOrc().doc(orc.id), { status: 'atualizado', historico: hist, atualizadoEm: agora(), atualizadoPor: usuarioAtual.nome });
      }
      return n;
    });
    if (!orcamentos.find(o => o.id === nova.id)) { orcamentos.push(normalizar({ ...nova })); ordenar(); }
    abrirOrcamento(nova.id);
    toast(`${labelOrcamento(nova)} criada!`, 'sucesso');
  } catch (e) {
    console.error(e);
    toast(e.message === 'conflito'
      ? 'Outra pessoa acabou de criar essa atualização. Confira a lista e tente de novo.'
      : 'Não foi possível criar a atualização. Verifique a conexão.', 'erro');
  }
}

async function moverParaLixeira() {
  const orc = getAtivo();
  if (!orc) return;
  if (!confirm(`Mover a ${labelOrcamento(orc)} para a lixeira?\nVocê pode restaurá-la depois pelo filtro "Lixeira".`)) return;
  await gravarTodos();
  adicionarHistorico(orc, '🗑', `Movida para a lixeira por ${usuarioAtual.nome}`);
  orc.excluido = true;
  colOrc().doc(orc.id).update({
    excluido: true, excluidoEm: agora(), excluidoPor: usuarioAtual.nome,
    historico: orc.historico, atualizadoEm: agora(), atualizadoPor: usuarioAtual.nome,
  }).catch(e => { console.error(e); toast('Erro ao mover para a lixeira.', 'erro'); });
  orcamentoAtivo = null;
  renderSidebar();
  renderEditor();
  toast('Cotação movida para a lixeira.', 'info');
}

function restaurar() {
  const orc = getAtivo();
  if (!orc) return;
  adicionarHistorico(orc, '♻️', `Restaurada por ${usuarioAtual.nome}`);
  orc.excluido = false;
  colOrc().doc(orc.id).update({
    excluido: false, excluidoEm: FV.delete(), excluidoPor: FV.delete(),
    historico: orc.historico, atualizadoEm: agora(), atualizadoPor: usuarioAtual.nome,
  }).catch(e => { console.error(e); toast('Erro ao restaurar.', 'erro'); });
  $('filtroStatus').value = 'todos';
  renderSidebar();
  renderEditor();
  toast('Cotação restaurada.', 'sucesso');
}

// ════════════════════════════════════════════
//  EDIÇÃO
// ════════════════════════════════════════════
function atualizarCampo(campo, valor) {
  const orc = getAtivo();
  if (!orc || estaBloqueado(orc)) return;
  orc[campo] = valor;
  const patch = { [campo]: valor };
  if (campo === 'moeda') {
    let mudou = false;
    orc.itens.forEach(i => { if ('moeda' in i) { delete i.moeda; mudou = true; } });
    if (mudou) patch.itens = orc.itens;
    agendar(orc.id, patch);
    renderEditor(true);
    return;
  }
  agendar(orc.id, patch);
  if (campo === 'cliente') renderSidebar();
  if (campo === 'freteTipo') renderEditor(true);
  if (campo === 'freteValor') atualizarTotais(orc);
}

function atualizarItem(idItem, campo, valor, input) {
  const orc = getAtivo();
  if (!orc || estaBloqueado(orc)) return;
  const item = orc.itens.find(i => i.id === idItem);
  if (!item) return;
  item[campo] = valor;
  agendar(orc.id, { itens: orc.itens });
  if (input && campo === 'qtde') input.classList.toggle('invalido', linhaTemConteudo(item) && isNaN(parseQtde(valor)));
  atualizarTotais(orc, item);
}

function atualizarTotais(orc, item) {
  if (item) {
    const td = document.querySelector(`[data-total="${CSS.escape(item.id)}"]`);
    if (td) td.textContent = textoTotalLinha(orc, item);
  }
  const t = $('totalGeral');
  if (t) t.textContent = textoTotalGeral(orc);
  const s = $('subtotalItens');
  if (s) s.textContent = `${orc.moeda} ${formatMoeda(subtotalItens(orc))}`;
  const f = $('totalFrete');
  if (f) f.textContent = `${orc.moeda} ${formatMoeda(valorFrete(orc))}`;
}

function textoTotalLinha(orc, item) {
  const t = totalItem(item);
  return t ? `${orc.moeda} ${formatMoeda(t)}` : '—';
}

function textoTotalGeral(orc) {
  const t = totalCotacao(orc);
  return t ? `${orc.moeda} ${formatMoeda(t)}` : '—';
}

function adicionarLinha() {
  const orc = getAtivo();
  if (!orc || estaBloqueado(orc)) return;
  const nova = linhaVazia();
  orc.itens.push(nova);
  agendar(orc.id, { itens: orc.itens });
  $('tbodyItens').innerHTML = renderItens(orc, false);
  atualizarTotais(orc);
  const n = document.querySelector(`[data-k="i:${CSS.escape(nova.id)}:descricao"]`);
  if (n) n.focus();
}

function removerLinha(idItem) {
  const orc = getAtivo();
  if (!orc || estaBloqueado(orc)) return;
  if (orc.itens.length <= 1) { toast('O orçamento precisa ter ao menos 1 linha.', 'info'); return; }
  const item = orc.itens.find(i => i.id === idItem);
  if (item && linhaTemConteudo(item) && !confirm('Remover esta linha?')) return;
  orc.itens = orc.itens.filter(i => i.id !== idItem);
  agendar(orc.id, { itens: orc.itens });
  $('tbodyItens').innerHTML = renderItens(orc, false);
  atualizarTotais(orc);
}

//  CNPJ (BrasilAPI)
// ════════════════════════════════════════════
function formatarCnpj(valor) {
  let v = String(valor || '').replace(/\D/g, '').slice(0, 14);
  if (v.length > 12) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{1,2})$/, '$1.$2.$3/$4-$5');
  else if (v.length > 8) v = v.replace(/^(\d{2})(\d{3})(\d{3})(\d{1,4})$/, '$1.$2.$3/$4');
  else if (v.length > 5) v = v.replace(/^(\d{2})(\d{3})(\d{1,3})$/, '$1.$2.$3');
  else if (v.length > 2) v = v.replace(/^(\d{2})(\d{1,3})$/, '$1.$2');
  return v;
}

// Tenta 3 serviços públicos em sequência, cada um com limite de tempo.
// "Não encontrado" só é dado quando um serviço responde explicitamente que o CNPJ não existe.
const FONTES_CNPJ = [
  { id: 'brasilapi',    url: c => `https://brasilapi.com.br/api/cnpj/v1/${c}`, nome: 'BrasilAPI' },
  { id: 'minhareceita', url: c => `https://minhareceita.org/${c}`,             nome: 'Minha Receita' },
  { id: 'cnpjws',       url: c => `https://publica.cnpj.ws/cnpj/${c}`,         nome: 'CNPJ.ws' },
];
const cacheCnpj = {};

async function consultarCnpj(cnpj, aoTentar) {
  if (cacheCnpj[cnpj]) return cacheCnpj[cnpj];
  let naoEncontrado = 0;
  for (let i = 0; i < FONTES_CNPJ.length; i++) {
    const f = FONTES_CNPJ[i];
    if (i > 0 && aoTentar) aoTentar(`Fonte anterior não respondeu, tentando ${f.nome}...`);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    try {
      const resp = await fetch(f.url(cnpj), { signal: ctl.signal });
      if (resp.status === 404 || resp.status === 400) { naoEncontrado++; continue; }
      if (!resp.ok) continue;                       // 429, 5xx: tenta a próxima
      const dados = lerDadosCnpj(f.id, await resp.json());
      if (dados && (dados.razao || dados.fantasia)) {
        const r = { fonte: f.nome, dados };
        cacheCnpj[cnpj] = r;
        return r;
      }
    } catch (e) {
      console.warn(`CNPJ: ${f.nome} falhou`, e);    // tempo esgotado ou rede
    } finally {
      clearTimeout(timer);
    }
  }
  throw new Error(naoEncontrado >= 2 ? 'nao-encontrado' : 'indisponivel');
}

async function buscarCNPJ() {
  const orc = getAtivo();
  if (!orc || estaBloqueado(orc)) return;
  const id = orc.id;
  const input = $('f_cnpj'), statusEl = $('cnpjStatus'), btn = $('btnBuscarCnpj');
  const cnpjLimpo = (input.value || '').replace(/\D/g, '');
  if (cnpjLimpo.length !== 14) {
    statusEl.className = 'cnpj-status erro';
    statusEl.textContent = 'CNPJ incompleto. Digite os 14 números.';
    return;
  }
  if (!cnpjValido(cnpjLimpo)) {
    statusEl.className = 'cnpj-status erro';
    statusEl.textContent = 'Esse CNPJ não existe (dígito verificador não confere). Confira se não há número trocado.';
    return;
  }
  btn.disabled = true;
  btn.textContent = '⏳ Buscando...';
  statusEl.className = 'cnpj-status loading';
  statusEl.textContent = 'Consultando dados na Receita Federal...';

  try {
    const r = await consultarCnpj(cnpjLimpo, msg => { const st = $('cnpjStatus'); if (st) st.textContent = msg; });
    const alvo = orcamentos.find(o => o.id === id);
    if (!alvo) return;
    const x = r.dados;

    const patch = {};
    const nome = x.razao || x.fantasia;
    if (nome) patch.cliente = nome;
    const endereco = montarEnderecoCnpj(x);
    if (endereco) patch.enderecoCliente = endereco;
    if (!alvo.telefone && x.telefone) patch.telefone = formatarTelefone(x.telefone);
    if (!alvo.email && x.email) patch.email = String(x.email).toLowerCase();
    if (formatarCnpj(cnpjLimpo) !== alvo.cnpj) patch.cnpj = formatarCnpj(cnpjLimpo);

    Object.assign(alvo, patch);
    agendar(id, patch);
    if (orcamentoAtivo === id) {
      renderEditor(true);
      const st = $('cnpjStatus');
      const situacao = x.situacao && String(x.situacao).toUpperCase() !== 'ATIVA'
        ? ` ⚠️ Situação cadastral: ${x.situacao}` : '';
      st.className = 'cnpj-status ' + (situacao ? 'erro' : 'ok');
      st.textContent = `✓ Dados encontrados e preenchidos.${situacao}`;
    }
    renderSidebar();
    toast('Dados do CNPJ carregados!', 'sucesso');
  } catch (e) {
    console.error(e);
    const st = $('cnpjStatus');
    const naoExiste = e.message === 'nao-encontrado';
    const msg = naoExiste
      ? 'CNPJ não encontrado na Receita Federal. Confira o número.'
      : 'Os serviços de consulta da Receita não responderam agora. Tente de novo em 1 minuto ou preencha os dados manualmente.';
    if (st) { st.className = 'cnpj-status erro'; st.textContent = msg; }
    toast(naoExiste ? 'CNPJ não encontrado.' : 'Consulta de CNPJ indisponível no momento.', 'erro');
  } finally {
    const b = $('btnBuscarCnpj');
    if (b) { b.disabled = false; b.textContent = '🔍 Buscar'; }
  }
}

// Fonte Montserrat (a mesma do site) baixada uma vez e reaproveitada. Sem internet → Helvetica.
let fontesPDF = null, carregandoFontes = null;
function paraBase64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function carregarFontesPDF() {
  if (fontesPDF) return Promise.resolve(fontesPDF);
  if (!carregandoFontes) {
    carregandoFontes = (async () => {
      try {
        const pegar = async peso => {
          const ctl = new AbortController();
          const t = setTimeout(() => ctl.abort(), 8000);
          try {
            const r = await fetch(`https://cdn.jsdelivr.net/fontsource/fonts/montserrat@latest/latin-${peso}-normal.ttf`, { signal: ctl.signal });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return paraBase64(await r.arrayBuffer());
          } finally { clearTimeout(t); }
        };
        const [normal, semibold, bold] = await Promise.all(['400', '600', '700'].map(pegar));
        fontesPDF = { normal, semibold, bold };
        return fontesPDF;
      } catch (e) {
        console.warn('Montserrat indisponível; o PDF usará Helvetica.', e);
        carregandoFontes = null;
        return null;
      }
    })();
  }
  return carregandoFontes;
}

let gerandoPDF = false;
async function baixarPDF() {
  const orc = getAtivo();
  if (!orc || orc.excluido || gerandoPDF) return;
  gravarTodos();

  errosValidacao = validarParaPDF(orc);
  if (errosValidacao.length) {
    renderEditor(true);
    $('appContent').scrollIntoView({ behavior: 'smooth' });
    toast('Corrija os itens indicados antes de baixar.', 'erro');
    return;
  }

  let doc;
  gerandoPDF = true;
  const btn = document.querySelector('[data-acao="pdf"]');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Gerando...'; }
  try {
    const fontes = await carregarFontesPDF();
    doc = montarPDF(orc, window.jspdf.jsPDF, fontes);
  } catch (e) {
    console.error(e);
    toast('Erro ao gerar o PDF.', 'erro');
    return;
  } finally {
    gerandoPDF = false;
    const b = document.querySelector('[data-acao="pdf"]');
    if (b) { b.disabled = false; b.textContent = '⬇️ Baixar PDF'; }
  }
  const arquivo = nomeArquivo(orc);
  doc.save(arquivo);

  const patch = { atualizadoEm: agora(), atualizadoPor: usuarioAtual.nome };
  if (orc.status === 'rascunho') { orc.status = 'baixado'; patch.status = 'baixado'; }
  adicionarHistorico(orc, '⬇️', `PDF baixado por ${usuarioAtual.nome}: ${arquivo}`);
  patch.historico = orc.historico;

  const batch = db.batch();
  batch.update(colOrc().doc(orc.id), patch);
  batch.set(db.collection('downloads').doc(), {
    vendedor: usuarioAtual.nome,
    vendedorId: usuarioAtual.id,
    cotacao: labelOrcamento(orc),
    cotacaoId: orc.id,
    cliente: orc.cliente || '(sem cliente)',
    timestamp: FV.serverTimestamp(),
  });
  batch.set(refStats(), { contagem: { [usuarioAtual.id]: FV.increment(1) } }, { merge: true });
  batch.commit().catch(e => {
    console.error(e);
    toast('PDF baixado, mas não foi possível registrar o download na nuvem.', 'erro');
  });

  renderSidebar();
  renderEditor(true);
  toast('PDF gerado e baixado!', 'sucesso');
}

async function exportarBackup() {
  try {
    const snap = await db.collection('downloads').get();
    const dados = {
      exportadoEm: agora(),
      exportadoPor: usuarioAtual.nome,
      orcamentos,
      downloads: snap.docs.map(d => {
        const v = d.data();
        return { ...v, timestamp: v.timestamp && v.timestamp.toDate ? v.timestamp.toDate().toISOString() : null };
      }),
    };
    const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `backup-elite-supply-${agora().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Backup exportado.', 'sucesso');
  } catch (e) {
    console.error(e);
    toast('Não foi possível exportar o backup.', 'erro');
  }
}

function renderSidebar() {
  const el = $('listaOrcamentos');
  const filtro = $('filtroStatus').value;
  const termo = semAcento($('filtroTexto').value).toLowerCase().trim();
  const termoNum = termo.replace(/\D/g, '');

  const lista = [...orcamentos].reverse().filter(o => {
    if (filtro === 'lixeira') { if (!o.excluido) return false; }
    else if (o.excluido) return false;
    else if (filtro !== 'todos' && o.status !== filtro) return false;
    if (!termo) return true;
    const alvo = semAcento(`${labelOrcamento(o)} ${o.cliente} ${o.contato}`).toLowerCase();
    if (alvo.includes(termo)) return true;
    if (termoNum && (String(o.numeroBase) === termoNum || String(o.cnpj || '').replace(/\D/g, '').includes(termoNum))) return true;
    return false;
  });

  $('listaContagem').textContent = carregado ? `${lista.length} ${lista.length === 1 ? 'cotação' : 'cotações'}` : '';

  if (!carregado) { el.innerHTML = ''; return; }
  if (lista.length === 0) {
    el.innerHTML = `<div style="padding:10px 12px; font-size:12px; color:rgba(255,255,255,0.5);">${
      orcamentos.length === 0 ? 'Nenhum orçamento ainda.' : 'Nada encontrado.'}</div>`;
    return;
  }
  el.innerHTML = lista.map(o => `
    <button type="button" class="orc-item ${orcamentoAtivo === o.id ? 'ativo' : ''}" data-id="${esc(o.id)}" ${orcamentoAtivo === o.id ? 'aria-current="true"' : ''}>

  `).join('');
}

function renderEditor(preservar = false) {
  const el = $('appContent');
  if (!usuarioAtual) { el.innerHTML = ''; return; }

  // Guarda foco/cursor/rolagem para restaurar depois de redesenhar
  let foco = null;
  const mainEl = document.querySelector('.main');
  const sy = window.scrollY, st = mainEl.scrollTop;
  if (preservar) {
    const a = document.activeElement;
    if (a && el.contains(a) && a.dataset && a.dataset.k) {
      foco = { k: a.dataset.k, s: null, e: null };
      try { foco.s = a.selectionStart; foco.e = a.selectionEnd; } catch {}
    }
  }

  const orc = getAtivo();
  el.innerHTML = orc ? htmlEditor(orc) : htmlPainel();
  if (!orc) renderDownloadsPanel();
  atualizarSaveState();

  if (preservar) {
    window.scrollTo(0, sy);
    mainEl.scrollTop = st;
    if (foco) {
      const n = el.querySelector(`[data-k="${CSS.escape(foco.k)}"]`);
      if (n && !n.disabled) {
        n.focus({ preventScroll: true });
        try { if (foco.s !== null) n.setSelectionRange(foco.s, foco.e); } catch {}
      }
    }
  }
}
