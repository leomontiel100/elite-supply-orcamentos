                <td colspan="3"></td>
              </tr>` : ''}
              <tr class="tfoot-total">
                <td colspan="4" class="total-label">Valor Total da Cotação</td>
                <td class="col-total" id="totalGeral" style="color:white">${esc(textoTotalGeral(orc))}</td>
                <td colspan="3"></td>
              </tr>
            </tfoot>
          </table>
        </div>
        ${bloq ? '' : `<button type="button" class="btn-add-linha" data-acao="add-linha">＋ Adicionar linha</button>`}
      </div>
    </div>

    <!-- CONDIÇÕES -->
    <div class="card">
      <div class="card-header"><h3>📋 Condições da Proposta</h3></div>
      <div class="card-body">
        <div class="form-grid rodape-grid">
          <div class="form-group">
            <label for="f_vendedor">Vendedor</label>
            <select id="f_vendedor" data-k="f:vendedor" ${D}>
              ${vendedorOpcoes.map(n => `<option ${n === vendSel ? 'selected' : ''}>${esc(n)}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label for="f_validade">Validade da Proposta</label>
            <input type="date" id="f_validade" data-k="f:validade" value="${esc(orc.validade)}" ${D}>
          </div>
          <div class="form-group">
            <label for="f_condicao">Condição de Pagamento</label>
            <input type="text" id="f_condicao" data-k="f:condicaoPagamento" value="${esc(orc.condicaoPagamento)}" placeholder="Ex: 30 DDL" ${D}>
          </div>
          <div class="form-group">
            <label for="f_forma">Forma de Pagamento</label>
            <select id="f_forma" data-k="f:formaPagamento" ${D}>
              <option value="" ${!orc.formaPagamento ? 'selected' : ''}>Selecione…</option>
              ${[...FORMAS_PAGAMENTO, ...(orc.formaPagamento && !FORMAS_PAGAMENTO.includes(orc.formaPagamento) ? [orc.formaPagamento] : [])]
                .map(f => `<option ${orc.formaPagamento === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-grid rodape-grid" style="margin-top:12px">
          <div class="form-group" style="grid-column: span 2">
            <label for="f_frete">Frete *</label>
            <select id="f_frete" data-k="f:freteTipo" ${D}>
              <option value="" ${!orc.freteTipo ? 'selected' : ''}>Selecione…</option>
              ${FRETES.map(f => `<option value="${f.v}" ${orc.freteTipo === f.v ? 'selected' : ''}>${esc(f.label)}</option>`).join('')}
            </select>
          </div>
          ${orc.freteTipo === 'valor' ? `
          <div class="form-group">
            <label for="f_freteValor">Valor do frete (${esc(orc.moeda)})</label>
            <input type="text" inputmode="decimal" id="f_freteValor" data-k="f:freteValor" value="${esc(orc.freteValor)}" placeholder="0,00" style="text-align:right" ${D}>
          </div>` : ''}
          <div class="form-group" style="grid-column: span ${orc.freteTipo === 'valor' ? 1 : 2}">
            <label for="f_garantia">Garantia</label>
            <input type="text" id="f_garantia" data-k="f:garantia" value="${esc(orc.garantia)}" placeholder="Conforme fabricante" ${D}>
          </div>
        </div>
        <div class="form-grid" style="margin-top:12px">
          <div class="form-group">
            <label for="f_obs">Observações</label>
            <textarea id="f_obs" data-k="f:observacoes" placeholder="Informações adicionais, condições especiais..." ${D}>${esc(orc.observacoes)}</textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- HISTÓRICO -->
    <div class="card">
      <div class="card-header"><h3>🕓 Histórico</h3></div>
      <div class="card-body">${renderHistorico(orc)}</div>
    </div>

    <div style="height:40px"></div>
  `;
}

function renderItens(orc, bloq) {
  const D = bloq ? 'disabled' : '';
  return orc.itens.map((item, i) => {
    const id = esc(item.id), n = i + 1;
    const qtdeInvalida = linhaTemConteudo(item) && isNaN(parseQtde(item.qtde));
    return `
    <tr>
      <td class="col-ref"><input type="text" data-k="i:${id}:referencia" value="${esc(item.referencia)}" placeholder="Cód." aria-label="Referência, linha ${n}" ${D}></td>
      <td><input type="text" data-k="i:${id}:descricao" value="${esc(item.descricao)}" placeholder="Descrição do produto" style="min-width:200px" aria-label="Descrição, linha ${n}" ${D}></td>
      <td class="col-qtde"><input type="text" inputmode="decimal" data-k="i:${id}:qtde" value="${esc(item.qtde)}" style="text-align:center" class="${qtdeInvalida ? 'invalido' : ''}" aria-label="Quantidade, linha ${n}" ${D}></td>
      <td class="col-unit"><input type="text" inputmode="decimal" data-k="i:${id}:unitario" value="${esc(item.unitario)}" placeholder="0,00" style="text-align:right" aria-label="Valor unitário, linha ${n}" ${D}></td>
      <td class="col-total" data-total="${id}">${esc(textoTotalLinha(orc, item))}</td>
      <td class="col-dias"><input type="text" inputmode="numeric" data-k="i:${id}:entrega" value="${esc(item.entrega)}" placeholder="—" style="text-align:center" aria-label="Entrega em dias úteis, linha ${n}" ${D}></td>
      <td class="col-fat"><input type="text" data-k="i:${id}:faturadoPor" value="${esc(item.faturadoPor)}" placeholder="Distribuidor que emite a NF" aria-label="Faturado por, linha ${n}" ${D}></td>
      <td class="col-del">${bloq ? '' : `<button type="button" class="btn-del-row" data-acao="del-linha" data-item="${id}" aria-label="Remover linha ${n}" title="Remover linha">✕</button>`}</td>
    </tr>`;
  }).join('');
}

function renderHistorico(orc) {
  if (!orc.historico || orc.historico.length === 0) {
    return '<div style="font-size:13px; color:var(--cinza-texto);">Nenhuma ação registrada ainda.</div>';
  }
  return orc.historico.map(h => `
    <div class="historico-item">
      <span class="historico-icone" aria-hidden="true">${esc(h.icone)}</span>
      <span class="historico-texto">${esc(h.texto)}</span>
      <span class="historico-data">${esc(h.data)}</span>
    </div>
  `).join('');
}

function renderDownloadsPanel() {
  const grid = $('downloadsGrid'), log = $('downloadLog');
  if (!grid || !log) return;
  const contagem = (stats && stats.contagem) || {};
  grid.innerHTML = EQUIPE.map(m => `
    <div class="download-card">
      <div class="avatar" aria-hidden="true">${esc(m.nome[0])}</div>
      <div class="info">
        <div class="nome">${esc(m.nome)}</div>
        <div class="qtd">${stats ? (Number(contagem[m.id]) || 0) : '…'}</div>
        <div class="label">orçamentos baixados</div>
      </div>
    </div>
  `).join('');

  if (downloads.length === 0) {
    log.innerHTML = '<div style="font-size:13px; color:var(--cinza-texto); padding:8px;">Nenhum download registrado ainda.</div>';
    return;
  }
  log.innerHTML = downloads.map(d => `
    <div class="download-log-item">
      <span class="tag">${esc(d.vendedor || '—')}</span>
      <span class="desc">${esc(d.cotacao)} — ${esc(d.cliente)}</span>
      <span class="data">${d.timestamp && d.timestamp.toDate ? esc(d.timestamp.toDate().toLocaleString('pt-BR')) : 'agora'}</span>
    </div>
  `).join('');
}

// ════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════
let toastTimer;
function toast(msg, tipo = 'info') {
  const el = $('toast');
  el.textContent = (tipo === 'sucesso' ? '✅ ' : tipo === 'erro' ? '⚠️ ' : 'ℹ️ ') + msg;
  el.className = 'toast show ' + tipo;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast ' + tipo, tipo === 'erro' ? 5000 : 2800);
}

// ════════════════════════════════════════════
//  EVENTOS
// ════════════════════════════════════════════
$('logoSidebar').src = LOGO_BRANCO;
$('logoLogin').src = LOGO_BRANCO;
$('loginForm').addEventListener('submit', entrar);
$('btnEsqueci').addEventListener('click', esqueciSenha);
$('btnSair').addEventListener('click', sair);
$('btnNovo').addEventListener('click', novoOrcamento);
$('filtroTexto').addEventListener('input', renderSidebar);
$('filtroStatus').addEventListener('change', renderSidebar);
$('btnVoltarPainel').addEventListener('click', () => { if (orcamentoAtivo && pendentes[orcamentoAtivo]) gravar(orcamentoAtivo); orcamentoAtivo = null; renderSidebar(); renderEditor(); });

$('listaOrcamentos').addEventListener('click', e => {
  const b = e.target.closest('[data-id]');
  if (b) abrirOrcamento(b.dataset.id);
});

const app = $('appContent');

function aoEditar(e) {
  const t = e.target;
  const k = t.dataset && t.dataset.k;
  if (!k) return;
  if (k.startsWith('f:')) {
    const campo = k.slice(2);
    if (campo === 'cnpj') {
      const f = formatarCnpj(t.value);
      if (f !== t.value) t.value = f;
    }
    atualizarCampo(campo, t.value);
  } else if (k.startsWith('i:')) {
    const [, idItem, campo] = k.split(':');
    atualizarItem(idItem, campo, t.value, t);
  }
  if (errosValidacao.length) { errosValidacao = []; const b = app.querySelector('.banner-erro[role="alert"]'); if (b) b.remove(); }
}
app.addEventListener('input', e => { if (e.target.tagName !== 'SELECT') aoEditar(e); });
app.addEventListener('change', e => { if (e.target.tagName === 'SELECT') aoEditar(e); });

// Ao sair do campo de valor: formata como 1.234,56
app.addEventListener('focusout', e => {
  const t = e.target, k = t.dataset && t.dataset.k;
  if (!k || !(k.endsWith(':unitario') || k === 'f:freteValor') || t.disabled) return;
  const n = parseMoeda(t.value);
  if (n > 0) {
    const f = formatMoeda(n);
    if (f !== t.value) { t.value = f; aoEditar({ target: t }); }
  }
});

app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'f_cnpj') { e.preventDefault(); buscarCNPJ(); }
});

app.addEventListener('click', e => {
  const b = e.target.closest('[data-acao]');
  if (!b || b.disabled) return;
  switch (b.dataset.acao) {
    case 'pdf': baixarPDF(); break;
    case 'excluir': moverParaLixeira(); break;
    case 'restaurar': restaurar(); break;
    case 'atualizacao': criarAtualizacao(); break;
    case 'cnpj': buscarCNPJ(); break;
    case 'add-linha': adicionarLinha(); break;
    case 'del-linha': removerLinha(b.dataset.item); break;
    case 'abrir': abrirOrcamento(b.dataset.id); break;
    case 'backup': exportarBackup(); break;
  }
});

window.addEventListener('online', () => marcarConectado(true));
window.addEventListener('offline', () => marcarConectado(false));
</script>
